name: uptime
# Off-PC uptime monitor (LedgerSpeak H-13 step 3). GitHub can start scheduled runs several minutes late.
# Repo moved to amagisolutionsgroup 2026-11-24; this comment re-registers the schedule.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send one test alert to Telegram + email"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: uptime
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run checks
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          TEST_ALERT: ${{ inputs.test_alert && 'true' || 'false' }}
        run: python3 monitor.py
      - name: Save state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state)" ]; then
            git config user.name "AmagiLabs"
            git config user.email "280616599+zerogeeks@users.noreply.github.com"
            git add state && git commit -qm "uptime state" && git push -q || echo "state push skipped"
          fi
